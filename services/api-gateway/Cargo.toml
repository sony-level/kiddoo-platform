[package]
name = "api-gateway"
description.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
# Web framework
rocket = { version = "0.5.1", features = ["json", "tls", "secrets"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for proxying
reqwest = { version = "0.13.2", features = ["json", "rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI Documentation
utoipa = { version = "5", features = ["rocket_extras"] }
utoipa-swagger-ui = { version = "9", features = ["rocket"] }

# Identity Proxy (for shared models)
identity-proxy = { path = "../identity-proxy" }

# Utils
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
