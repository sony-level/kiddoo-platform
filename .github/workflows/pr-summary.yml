# =============================================================================
# GitHub Actions — PR Summary (Copilot auto-generated)
#
# Generates a short, precise summary of changes on every pull request.
# Uses GitHub Copilot to analyze the diff and post a comment.
# =============================================================================
name: PR Summary

on:
  pull_request:
    branches:
      - develop
      - release
      - release/*
      - master
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff summary
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Get changed files summary
          FILES_CHANGED=$(git diff --stat $BASE $HEAD | tail -1)
          FILE_LIST=$(git diff --name-only $BASE $HEAD)

          # Get short diff for analysis
          DIFF=$(git diff --stat $BASE $HEAD)

          # Build summary
          {
            echo "summary<<EOF"
            echo "## PR Summary"
            echo ""
            echo "### Changes"
            echo "\`\`\`"
            echo "$DIFF"
            echo "\`\`\`"
            echo ""
            echo "### Files modified"
            echo "$FILE_LIST" | while read -r file; do
              if [ -n "$file" ]; then
                EXT="${file##*.}"
                case "$EXT" in
                  rs) ICON="[rs]" ;;
                  toml) ICON="[toml]" ;;
                  yml|yaml) ICON="[yml]" ;;
                  tf) ICON="[tf]" ;;
                  md) ICON="[md]" ;;
                  Dockerfile|docker) ICON="[docker]" ;;
                  *) ICON="-" ;;
                esac
                echo "- $ICON \`$file\`"
              fi
            done
            echo ""
            echo "---"
            echo "*Auto-generated by PR Summary workflow*"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-summary
          message: ${{ steps.diff.outputs.summary }}
