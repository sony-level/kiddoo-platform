name: CI/CD Pipeline Orchestrator

on:
  push:
    branches: 
      - develop
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

jobs:
  # Main orchestrator - checks status of all workflows
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    
    steps:
      - name: Pipeline Status Check
        run: |
          echo "CI/CD Pipeline started"
          echo ""
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "Branch: MASTER"
            echo "   Production deployment via PR merge"
            echo "   Code validated via Pull Request"
            echo "   Direct push forbidden"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "master" ]; then
            echo "PR to MASTER"
            echo "Workflows executed:"
            echo "   Code formatting"
            echo "   Security analysis"
            echo "   Complete tests"
            echo "   Build validation"
            echo "   No deployment (validation only)"
          else
            echo "Branch: ${{ github.ref_name }}"
            echo "Workflows executed:"
            echo "   Code formatting"
            echo "   Security analysis"
            echo "   Complete tests"
            echo "   Build validation"
            echo "   Staging deployment"
          fi
          echo ""
          echo "Strict rules applied:"
          echo " Master → Production (only via PR merge)"
          echo " Direct push to Master → Forbidden"
          echo " PR to Master → Complete tests required"
          echo " Other branches → Staging (with validation)"
