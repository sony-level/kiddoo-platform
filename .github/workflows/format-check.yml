name: Code Formatting Check

on:
  push:
    branches: 
      - develop
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - master
      - develop

jobs:
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    outputs:
      format-passed: ${{ steps.format.outcome == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        id: format
        run: |
          cargo fmt --all -- --check
          echo "Code formatting is correct"
