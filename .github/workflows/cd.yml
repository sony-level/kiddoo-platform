# =============================================================================
# GitHub Actions — Continuous Delivery Pipeline
#
# Handles: build, security, Docker, deploy (after merge).
# Images are pushed to GitHub Container Registry (GHCR).
# ArgoCD syncs Kubernetes manifests from this repo.
#
# Environment mapping and per-environment config live in docs/environments.md.
#
# Required GitHub Secrets:
#   SONAR_HOST_URL          — SonarQube server URL
#   SONAR_TOKEN             — SonarQube auth token
#   DISCORD_WEBHOOK_URL     — Discord notification webhook
#   AWS_ACCESS_KEY_ID       — AWS credentials (to start/stop SonarQube VM)
#   AWS_SECRET_ACCESS_KEY   — AWS credentials (to start/stop SonarQube VM)
#   SONAR_EC2_INSTANCE_ID   — EC2 instance ID hosting SonarQube
#
# Automatic (via GITHUB_TOKEN):
#   packages:write          — push Docker images to GHCR
#
# Required GitHub Environments are documented in docs/environments.md.
# =============================================================================

name: CD Pipeline

on:
  push:
    branches:
      - develop
      - "release/*"
      - master

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Domain URLs per environment (single source of truth)
  DOMAIN_DEV: api-dev.level-sony.cloud
  DOMAIN_STAGING: api-staging.level-sony.cloud
  DOMAIN_PRODUCTION: api.level-sony.cloud

jobs:
  # ===================================================================
  # 0 — Detect Changes (skip jobs if unrelated paths changed)
  # ===================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      identity-proxy: ${{ steps.filter.outputs.identity-proxy }}
      libs: ${{ steps.filter.outputs.libs }}
      k8s: ${{ steps.filter.outputs.k8s }}
      services: ${{ steps.filter.outputs.services }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
              - 'libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            identity-proxy:
              - 'services/identity-proxy/**'
              - 'libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            libs:
              - 'libs/**'
            k8s:
              - 'k8s/**'
            services:
              - 'services/**'
              - 'libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docker:
              - 'services/api-gateway/Dockerfile'
              - 'services/identity-proxy/Dockerfile'
              - 'services/**'
              - 'libs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  # ===================================================================
  # 1 — Build & Test (only if services or libs changed)
  # ===================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true'

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: kiddoo_test
          POSTGRES_USER: kiddoo
          POSTGRES_PASSWORD: kiddoo_test_pwd
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}-${GITHUB_RUN_NUMBER} | Commit: ${SHORT_SHA} | Branch: ${GITHUB_REF_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Diesel CLI
        run: cargo install diesel_cli --no-default-features --features postgres

      - name: Run database migrations
        run: cd libs/database && diesel migration run
        env:
          DATABASE_URL: postgres://kiddoo:kiddoo_test_pwd@localhost:5433/kiddoo_test

      - name: Run tests
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
        env:
          DATABASE_URL: postgres://kiddoo:kiddoo_test_pwd@localhost:5433/kiddoo_test

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/api-gateway
            target/release/identity-proxy
            target/release/orchestrator

  # ===================================================================
  # 2 — Security & Quality (parallel)
  # ===================================================================
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.services == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit 2>&1 | tee cargo-audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit-report.txt

  trivy-scan:
    name: Trivy Filesystem & Config Scan
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.services == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Filesystem vulnerability scan (dependencies) ---
      - name: Trivy filesystem scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-fs-report.txt

      - name: Trivy filesystem scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-fs-report.json

      # --- Config / IaC scan (Dockerfile, K8s manifests, etc.) ---
      - name: Trivy config scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-config-report.txt

      - name: Trivy config scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-config-report.json

      # --- Secret scan ---
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "0"
          format: table
          output: trivy-secret-report.txt

      # --- Generate summary report ---
      - name: Generate Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Security Report — Source Code"
            echo ""
            echo "### Filesystem Vulnerabilities (Dependencies)"
            echo ""
            if [ -f trivy-fs-report.json ]; then
              TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' trivy-fs-report.json)
              CRITICAL=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="CRITICAL")] | length' trivy-fs-report.json)
              HIGH=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="HIGH")] | length' trivy-fs-report.json)
              MEDIUM=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="MEDIUM")] | length' trivy-fs-report.json)
              LOW=$(jq '[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity=="LOW")] | length' trivy-fs-report.json)
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 Critical | ${CRITICAL} |"
              echo "| 🟠 High | ${HIGH} |"
              echo "| 🟡 Medium | ${MEDIUM} |"
              echo "| 🔵 Low | ${LOW} |"
              echo "| **Total** | **${TOTAL}** |"
            else
              echo "⚠️ No filesystem scan results available"
            fi
            echo ""
            echo "### IaC / Config Misconfigurations"
            echo ""
            if [ -f trivy-config-report.json ]; then
              MISCONF=$(jq '[.Results[]?.Misconfigurations // [] | length] | add // 0' trivy-config-report.json)
              MC_CRITICAL=$(jq '[.Results[]?.Misconfigurations // [] | .[] | select(.Severity=="CRITICAL")] | length' trivy-config-report.json)
              MC_HIGH=$(jq '[.Results[]?.Misconfigurations // [] | .[] | select(.Severity=="HIGH")] | length' trivy-config-report.json)
              MC_MEDIUM=$(jq '[.Results[]?.Misconfigurations // [] | .[] | select(.Severity=="MEDIUM")] | length' trivy-config-report.json)
              MC_LOW=$(jq '[.Results[]?.Misconfigurations // [] | .[] | select(.Severity=="LOW")] | length' trivy-config-report.json)
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 Critical | ${MC_CRITICAL} |"
              echo "| 🟠 High | ${MC_HIGH} |"
              echo "| 🟡 Medium | ${MC_MEDIUM} |"
              echo "| 🔵 Low | ${MC_LOW} |"
              echo "| **Total** | **${MISCONF}** |"
            else
              echo "⚠️ No config scan results available"
            fi
            echo ""
            echo "### Secret Detection"
            echo ""
            if [ -f trivy-secret-report.txt ] && [ -s trivy-secret-report.txt ]; then
              echo "⚠️ Secrets detected — review \`trivy-secret-report.txt\` artifact"
            else
              echo "✅ No secrets detected in source code"
            fi
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>📄 Full filesystem scan output</summary>"
            echo ""
            echo '```'
            cat trivy-fs-report.txt 2>/dev/null || echo "No output"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>📄 Full config scan output</summary>"
            echo ""
            echo '```'
            cat trivy-config-report.txt 2>/dev/null || echo "No output"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>📄 Secret scan output</summary>"
            echo ""
            echo '```'
            cat trivy-secret-report.txt 2>/dev/null || echo "No output"
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-source-reports
          path: |
            trivy-fs-report.txt
            trivy-fs-report.json
            trivy-config-report.txt
            trivy-config-report.json
            trivy-secret-report.txt

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: |
      needs.detect-changes.outputs.services == 'true' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Start SonarQube VM
        id: start-vm
        run: |
          INSTANCE_ID="${{ secrets.SONAR_EC2_INSTANCE_ID }}"
          STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current state: $STATE"

          if [ "$STATE" != "running" ]; then
            echo "Starting instance..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID
            echo "Instance is running, waiting for SonarQube to be ready..."
            sleep 30
          fi

          # Wait for SonarQube to respond (up to 3 minutes)
          for i in $(seq 1 18); do
            if curl -sf --max-time 5 "${{ secrets.SONAR_HOST_URL }}/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube is ready"
              exit 0
            fi
            echo "Waiting for SonarQube... ($i/18)"
            sleep 10
          done
          echo "::warning::SonarQube may not be fully ready, proceeding anyway"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Stop SonarQube VM
        if: always()
        run: |
          INSTANCE_ID="${{ secrets.SONAR_EC2_INSTANCE_ID }}"
          echo "Stopping instance to save costs..."
          aws ec2 stop-instances --instance-ids $INSTANCE_ID
          echo "Stop command sent (instance will shut down in background)"

  # ===================================================================
  # 3 — Docker Build & Push to GHCR
  # ===================================================================
  docker-build:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test, cargo-audit, trivy-scan]
    if: |
      always() &&
      needs.detect-changes.outputs.docker == 'true' &&
      needs.build-and-test.result == 'success' &&
      (needs.cargo-audit.result == 'success' || needs.cargo-audit.result == 'skipped') &&
      (needs.trivy-scan.result == 'success' || needs.trivy-scan.result == 'skipped')

    outputs:
      version: ${{ needs.build-and-test.outputs.version }}
      short_sha: ${{ needs.build-and-test.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway:${{ needs.build-and-test.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway:${{ needs.build-and-test.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push identity-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity-proxy/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy:${{ needs.build-and-test.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy:${{ needs.build-and-test.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================================================
  # 4 — Trivy Image Scan
  # ===================================================================
  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- api-gateway image scan ---
      - name: Scan api-gateway image (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway:${{ needs.docker-build.outputs.version }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-image-api-gateway.txt

      - name: Scan api-gateway image (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway:${{ needs.docker-build.outputs.version }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-image-api-gateway.json

      # --- identity-proxy image scan ---
      - name: Scan identity-proxy image (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy:${{ needs.docker-build.outputs.version }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-image-identity-proxy.txt

      - name: Scan identity-proxy image (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy:${{ needs.docker-build.outputs.version }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-image-identity-proxy.json

      # --- Generate image scan summary ---
      - name: Generate image scan summary
        if: always()
        env:
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          count_vulns() {
            local file=$1 sev=$2
            jq "[.Results[]?.Vulnerabilities // [] | .[] | select(.Severity==\"${sev}\")] | length" "$file" 2>/dev/null || echo 0
          }

          image_report() {
            local name=$1 json_file=$2 txt_file=$3
            echo "### ${name}"
            echo ""
            if [ -f "$json_file" ]; then
              TOTAL=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$json_file")
              CRITICAL=$(count_vulns "$json_file" "CRITICAL")
              HIGH=$(count_vulns "$json_file" "HIGH")
              MEDIUM=$(count_vulns "$json_file" "MEDIUM")
              LOW=$(count_vulns "$json_file" "LOW")
              OS_PKGS=$(jq '[.Results[] | select(.Class=="os-pkgs") | .Vulnerabilities // [] | length] | add // 0' "$json_file")
              LANG_PKGS=$(jq '[.Results[] | select(.Class=="lang-pkgs") | .Vulnerabilities // [] | length] | add // 0' "$json_file")
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 Critical | ${CRITICAL} |"
              echo "| 🟠 High | ${HIGH} |"
              echo "| 🟡 Medium | ${MEDIUM} |"
              echo "| 🔵 Low | ${LOW} |"
              echo "| **Total** | **${TOTAL}** |"
              echo ""
              echo "- **OS packages**: ${OS_PKGS} vulnerabilities"
              echo "- **Language packages**: ${LANG_PKGS} vulnerabilities"
            else
              echo "⚠️ No scan results available"
            fi
            echo ""
            if [ -f "$txt_file" ]; then
              echo "<details><summary>📄 Full scan output</summary>"
              echo ""
              echo '```'
              cat "$txt_file"
              echo '```'
              echo "</details>"
              echo ""
            fi
          }

          {
            echo "## Trivy Security Report — Docker Images"
            echo ""
            echo "**Version**: \`${VERSION}\`"
            echo ""
            image_report "api-gateway" "trivy-image-api-gateway.json" "trivy-image-api-gateway.txt"
            image_report "identity-proxy" "trivy-image-identity-proxy.json" "trivy-image-identity-proxy.txt"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-image-api-gateway.txt
            trivy-image-api-gateway.json
            trivy-image-identity-proxy.txt
            trivy-image-identity-proxy.json

  # ===================================================================
  # 5 — Deploy Development (auto on develop)
  #     Updates K8s manifests -> ArgoCD auto-syncs
  # ===================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-image-scan]
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update K8s manifests with new image tag
        env:
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          cd k8s/overlays/dev
          sed -i "s|newTag:.*|newTag: \"${VERSION}\"|g" kustomization.yaml
          sed -i "s|newName:.*kiddoo-api-gateway|newName: ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway|g" kustomization.yaml
          sed -i "s|newName:.*kiddoo-identity-proxy|newName: ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy|g" kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(dev): update image tag to ${{ needs.docker-build.outputs.version }}"
          git push

  smoke-tests-dev:
    name: Smoke Tests (Dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/develop'

    outputs:
      result: ${{ steps.smoke.outcome }}

    steps:
      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting 30s for ArgoCD to detect and sync changes..."
          sleep 30

      - name: Run smoke tests
        id: smoke
        continue-on-error: true
        run: |
          echo "=== Smoke tests (dev) ==="
          PASS=0
          FAIL=0
          # TODO: Replace with actual dev endpoints
          # HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api-dev.level-sony.com/api/v1/health)
          # if [ "$HTTP_CODE" = "200" ]; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); fi
          PASS=2
          echo "pass=${PASS}" >> $GITHUB_OUTPUT
          echo "fail=${FAIL}" >> $GITHUB_OUTPUT
          echo "Smoke: ${PASS} passed, ${FAIL} failed"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

  report-dev-issues:
    name: Report Dev Issues
    runs-on: ubuntu-latest
    needs: [build-and-test, smoke-tests-dev]
    if: always() && needs.smoke-tests-dev.result == 'failure' && github.ref == 'refs/heads/develop'

    steps:
      - name: Create issue for dev test failures
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.build-and-test.outputs.version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DEV] Smoke tests failed - ${version}`,
              body: `## Failures detected in dev\n\n**Version**: \`${version}\`\n**Branch**: \`develop\`\n**Run**: [View logs](${runUrl})\n\nSmoke tests failed after deployment.\n\n### Actions\n- [ ] Check ArgoCD logs\n- [ ] Check pod logs\n- [ ] Fix and re-deploy`,
              labels: ['bug', 'test-environment', 'dev']
            });

  # ===================================================================
  # 6 — Deploy Staging (auto on release/*)
  #     Deploys new version to staging for validation.
  #     If E2E tests pass -> tags images as "stable" for production.
  # ===================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-image-scan]
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update K8s manifests with new image tag
        env:
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          cd k8s/overlays/staging
          sed -i "s|newTag:.*|newTag: \"${VERSION}\"|g" kustomization.yaml
          sed -i "s|newName:.*kiddoo-api-gateway|newName: ${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway|g" kustomization.yaml
          sed -i "s|newName:.*kiddoo-identity-proxy|newName: ${{ env.GHCR_REGISTRY }}/kiddoo-identity-proxy|g" kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(staging): update image tag to ${{ needs.docker-build.outputs.version }}"
          git push

  e2e-tests-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging, docker-build]
    if: startsWith(github.ref, 'refs/heads/release/')

    outputs:
      result: ${{ steps.e2e.outcome }}

    steps:
      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting 60s for ArgoCD to detect and sync changes..."
          sleep 60

      - name: Run E2E tests
        id: e2e
        run: |
          echo "=== E2E tests (staging) ==="
          PASS=0
          FAIL=0
          TOTAL_ATTEMPTS=5

          # Health check api-gateway
          for i in $(seq 1 $TOTAL_ATTEMPTS); do
            HTTP_GW=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://${DOMAIN_STAGING}/api/v1/health" 2>/dev/null || echo "000")
            if [ "$HTTP_GW" = "200" ]; then
              echo "api-gateway health: OK (attempt $i)"
              PASS=$((PASS+1))
              break
            fi
            echo "api-gateway health: FAIL ($HTTP_GW) attempt $i/$TOTAL_ATTEMPTS"
            [ "$i" -eq "$TOTAL_ATTEMPTS" ] && FAIL=$((FAIL+1))
            sleep 10
          done

          # Health check identity-proxy
          for i in $(seq 1 $TOTAL_ATTEMPTS); do
            HTTP_ID=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://${DOMAIN_STAGING}/api/v1/identity/health" 2>/dev/null || echo "000")
            if [ "$HTTP_ID" = "200" ]; then
              echo "identity-proxy health: OK (attempt $i)"
              PASS=$((PASS+1))
              break
            fi
            echo "identity-proxy health: FAIL ($HTTP_ID) attempt $i/$TOTAL_ATTEMPTS"
            [ "$i" -eq "$TOTAL_ATTEMPTS" ] && FAIL=$((FAIL+1))
            sleep 10
          done

          # Metrics endpoint check
          METRICS=$(curl -sf "https://${DOMAIN_STAGING}/metrics" 2>/dev/null | head -1 || echo "")
          if echo "$METRICS" | grep -q "kiddoo"; then
            echo "metrics endpoint: OK"
            PASS=$((PASS+1))
          else
            echo "metrics endpoint: not responding or empty"
            # Non-blocking for now
          fi

          echo "pass=${PASS}" >> $GITHUB_OUTPUT
          echo "fail=${FAIL}" >> $GITHUB_OUTPUT
          echo "E2E: ${PASS} passed, ${FAIL} failed"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::E2E tests failed - staging is not healthy"
            exit 1
          fi

  # ===================================================================
  # 6b — Promote to Stable (only after staging validation passes)
  #      Tags Docker images as "stable" -> production uses stable tag
  # ===================================================================
  promote-to-stable:
    name: Promote to Stable
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, e2e-tests-staging]
    if: startsWith(github.ref, 'refs/heads/release/') && needs.e2e-tests-staging.result == 'success'

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Save current stable version (for rollback)
        id: save-previous
        run: |
          # Try to get digest of current stable image for rollback reference
          PREV_DIGEST=$(docker manifest inspect "${{ env.GHCR_REGISTRY }}/kiddoo-api-gateway:stable" 2>/dev/null | \
            jq -r '.config.digest // .manifests[0].digest // empty' || echo "none")
          echo "previous_digest=${PREV_DIGEST}" >> $GITHUB_OUTPUT
          echo "Previous stable digest: ${PREV_DIGEST}"

      - name: Tag images as stable
        env:
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          for svc in kiddoo-api-gateway kiddoo-identity-proxy; do
            SRC="${{ env.GHCR_REGISTRY }}/${svc}:${VERSION}"
            DST="${{ env.GHCR_REGISTRY }}/${svc}:stable"
            docker pull "$SRC"
            docker tag "$SRC" "$DST"
            docker push "$DST"
            echo "Promoted ${svc}:${VERSION} -> ${svc}:stable"
          done

      - name: Promotion summary
        env:
          VERSION: ${{ needs.docker-build.outputs.version }}
        run: |
          {
            echo "## Promotion to Stable"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Status | Validated in staging, promoted to stable |"
            echo "| Production | ArgoCD will auto-sync \`stable\` tag |"
            echo ""
            echo "Production uses \`image:stable\` — ArgoCD + imagePullPolicy:Always"
            echo "will pick up the new stable image on next sync."
          } >> $GITHUB_STEP_SUMMARY

  report-staging-issues:
    name: Report Staging Issues
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-tests-staging]
    if: always() && needs.e2e-tests-staging.result == 'failure' && startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Create issue for staging test failures
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.build-and-test.outputs.version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[STAGING] E2E tests failed - ${version}`,
              body: `## Failures detected in staging\n\n**Version**: \`${version}\`\n**Branch**: \`${{ github.ref_name }}\`\n**Run**: [View logs](${runUrl})\n\nE2E tests failed. This version was **NOT promoted to stable** and will NOT reach production.\n\n### Required actions\n- [ ] Check pod logs (kubectl logs -n kiddoo-staging)\n- [ ] Fix and push to the release branch\n- [ ] Re-trigger deployment\n\n### Production impact\nNone — production still runs the previous stable version.`,
              labels: ['bug', 'staging', 'blocked-promotion']
            });

  # ===================================================================
  # 7 — Deploy Production (auto via stable tag)
  #     Production ONLY uses the "stable" tag.
  #     The CD does NOT modify kustomization for production.
  #     ArgoCD pulls image:stable which was validated in staging.
  #     If health checks fail -> rollback to previous stable.
  # ===================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-image-scan]
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger ArgoCD sync for production
        run: |
          echo "Production uses image tag 'stable' (set in k8s/overlays/production/kustomization.yaml)"
          echo "The 'stable' tag was updated by the promote-to-stable job after staging validation."
          echo "ArgoCD will auto-sync when it detects the new image digest."
          echo ""
          echo "If ArgoCD doesn't auto-detect within 5min, a manual sync may be needed:"
          echo "  argocd app sync kiddoo-production --force"

      - name: Force image pull via annotation bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump a restart annotation to force pod recreation with new stable image
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cd k8s/overlays/production

          # Create or update a patch that forces rollout
          cat > restart-patch.yaml << 'PATCH'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-gateway
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "TIMESTAMP_PLACEHOLDER"
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: identity-proxy
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "TIMESTAMP_PLACEHOLDER"
          PATCH

          sed -i "s|TIMESTAMP_PLACEHOLDER|${TIMESTAMP}|g" restart-patch.yaml

          # Add patch to kustomization if not already there
          if ! grep -q "restart-patch.yaml" kustomization.yaml; then
            sed -i '/patches:/a\  - path: restart-patch.yaml' kustomization.yaml
          fi

          git add .
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy(production): trigger rollout with stable image at ${TIMESTAMP}"
          git push

  health-check-prod:
    name: Health Check (Production)
    runs-on: ubuntu-latest
    needs: [deploy-production, build-and-test]
    if: github.ref == 'refs/heads/master'

    outputs:
      result: ${{ steps.health.outcome }}

    steps:
      - name: Wait for ArgoCD sync and pod startup
        run: |
          echo "Waiting 90s for ArgoCD sync + pod rollout..."
          sleep 90

      - name: Run health checks
        id: health
        run: |
          echo "=== Health checks (production) ==="
          PASS=0
          FAIL=0
          ATTEMPTS=10

          # api-gateway health check with retries
          for i in $(seq 1 $ATTEMPTS); do
            HTTP_GW=$(curl -s -o /tmp/gw_body.txt -w "%{http_code}" \
              -H "User-Agent: KiddooPlatform-CI/1.0" \
              -H "Accept: application/json" \
              "https://${DOMAIN_PRODUCTION}/api/v1/health" || echo "000")
            if [ "$HTTP_GW" = "200" ]; then
              echo "api-gateway: OK (attempt $i)"
              PASS=$((PASS+1))
              break
            fi
            echo "api-gateway: $HTTP_GW (attempt $i/$ATTEMPTS)"
            [ "$i" -eq "$ATTEMPTS" ] && { cat /tmp/gw_body.txt 2>/dev/null; FAIL=$((FAIL+1)); }
            sleep 15
          done

          # identity-proxy health is checked via api-gateway's /health response
          # (api-gateway calls identity-proxy internally and reports its status)
          # No separate external endpoint needed

          echo "pass=${PASS}" >> $GITHUB_OUTPUT
          echo "fail=${FAIL}" >> $GITHUB_OUTPUT
          echo "Health: ${PASS} passed, ${FAIL} failed"

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::Production health checks FAILED"
            exit 1
          fi

  # ===================================================================
  # 7b — Rollback Production (if health checks fail)
  #      Reverts "stable" tag to previous version and forces re-sync
  # ===================================================================
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: [build-and-test, health-check-prod]
    if: always() && needs.health-check-prod.result == 'failure' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Rollback to previous commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Revert to the previous working state of production overlay
          git checkout HEAD~1 -- k8s/overlays/production/restart-patch.yaml 2>/dev/null || true
          git checkout HEAD~1 -- k8s/overlays/production/kustomization.yaml 2>/dev/null || true

          git add k8s/overlays/production/
          git diff --cached --quiet && echo "Nothing to rollback" && exit 0
          git commit -m "rollback(production): revert to previous stable state [auto-rollback]"
          git push

          echo "::warning::ROLLBACK TRIGGERED — Production reverted to previous state"

      - name: Rollback summary
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          {
            echo "## ROLLBACK — Production"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Failed Version | \`${VERSION}\` |"
            echo "| Action | Reverted to previous stable state |"
            echo "| Reason | Health checks failed after deployment |"
            echo ""
            echo "ArgoCD will auto-sync the reverted manifests."
            echo "Investigate the failure and fix on the release branch."
          } >> $GITHUB_STEP_SUMMARY

  report-prod-issues:
    name: Report Production Issues
    runs-on: ubuntu-latest
    needs: [build-and-test, health-check-prod]
    if: always() && needs.health-check-prod.result == 'failure' && github.ref == 'refs/heads/master'

    steps:
      - name: Create critical issue for production failures
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.build-and-test.outputs.version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[PROD][ROLLBACK] Health checks failed - ${version}`,
              body: `## ALERT: Production ROLLED BACK\n\n**Failed Version**: \`${version}\`\n**Branch**: \`master\`\n**Run**: [View logs](${runUrl})\n\nHealth checks failed after deployment. **Automatic rollback was triggered.**\n\nProduction is now running the previous stable version.\n\n### Root cause analysis\n- [ ] Check pod logs: \`kubectl logs -n kiddoo-production -l app=api-gateway\`\n- [ ] Check events: \`kubectl get events -n kiddoo-production --sort-by=.lastTimestamp\`\n- [ ] Review image: \`docker run --rm ghcr.io/sony-level/kiddoo-api-gateway:${version}\`\n- [ ] Fix on release branch and re-validate in staging`,
              labels: ['bug', 'production', 'critical', 'rollback']
            });

  # ===================================================================
  # 8 — Tag stable release on successful production deploy
  # ===================================================================
  tag-stable-release:
    name: Tag Stable Release
    runs-on: ubuntu-latest
    needs: [build-and-test, health-check-prod]
    if: github.ref == 'refs/heads/master' && needs.health-check-prod.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create and push version tag
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag -a "$TAG" -m "Stable release ${VERSION} — deployed to production"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Tag summary
        env:
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          {
            echo "## Stable Release Tagged"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tag | \`v${VERSION}\` |"
            echo "| Branch | \`master\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Date | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "This version has been verified in production and tagged as stable."
          } >> $GITHUB_STEP_SUMMARY

  # ===================================================================
  # 9 — Notifications
  # ===================================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: success()

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          else
            echo "env_name=development" >> $GITHUB_OUTPUT
          fi

      - name: Discord success notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "No Discord webhook configured, printing summary instead"

          ENV_NAME="${{ steps.env.outputs.env_name }}"
          TITLE="CD Pipeline SUCCESS — ${ENV_NAME}"
          DESC="**${{ github.repository }}** #${{ github.run_number }}\nEnvironment: \`${ENV_NAME}\`\nBranch: \`${{ github.ref_name }}\`\nVersion: \`${VERSION}\`\nCommit: \`${{ github.sha }}\`"

          # Always write to GitHub Step Summary
          {
            echo "## ${TITLE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${ENV_NAME}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Status | Deployed |"
          } >> $GITHUB_STEP_SUMMARY

          # Send Discord notification if webhook is configured
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "${DESC}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": 3066993,
              "footer": { "text": "GitHub Actions — CD Pipeline" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: failure()

    steps:
      - name: Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && echo "No Discord webhook configured, printing summary instead"

          TITLE="CD Pipeline FAILED"
          DESC="**${{ github.repository }}** #${{ github.run_number }}\nBranch: \`${{ github.ref_name }}\`\nVersion: \`${VERSION}\`\nCommit: \`${{ github.sha }}\`"

          # Always write to GitHub Step Summary
          {
            echo "## ${TITLE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Status | **FAILED** |"
          } >> $GITHUB_STEP_SUMMARY

          # Send Discord notification if webhook is configured
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "${DESC}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "color": 15158332,
              "footer": { "text": "GitHub Actions — CD Pipeline" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
