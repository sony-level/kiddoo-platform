name: CI/CD Pipeline Orchestrator

on:
  push:
    branches: 
      - develop
      - feature
      - hotfix
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Step 1: Format check
  format:
    name: Format Check
    uses: ./.github/workflows/format-check.yml
    secrets: inherit

  # Step 2: Security analysis
  security:
    name: Security Analysis
    needs: [format]
    uses: ./.github/workflows/security-analysis.yml
    secrets: inherit

  # Step 3: Comprehensive tests
  tests:
    name: Comprehensive Tests
    needs: [format]
    uses: ./.github/workflows/comprehensive-tests.yml
    secrets: inherit

  # Step 4: Build validation
  build:
    name: Build Validation
    needs: [security, tests]
    uses: ./.github/workflows/build-validation.yml
    secrets: inherit

  # Step 5: Deployment (only if all previous steps passed)
  deploy:
    name: Deployment
    needs: [build]
    uses: ./.github/workflows/deployment.yml
    secrets: inherit

  # Final status check
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [format, security, tests, build, deploy]
    if: always()
    
    steps:
      - name: Check all workflows status
        run: |
          echo "CI/CD Pipeline Summary"
          echo "======================"
          echo ""
          echo "Format Check: ${{ needs.format.result }}"
          echo "Security Analysis: ${{ needs.security.result }}"
          echo "Comprehensive Tests: ${{ needs.tests.result }}"
          echo "Build Validation: ${{ needs.build.result }}"
          echo "Deployment: ${{ needs.deploy.result }}"
          echo ""
          
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Pipeline FAILED - One or more steps did not succeed"
            exit 1
          fi
          
          echo "Pipeline PASSED - All steps completed successfully"
