# =============================================================================
# CI Pipeline Orchestrator — Quality Gate for Pull Requests
#
# This workflow runs on ALL pull requests and development branches.
# It acts as a mandatory quality gate: a PR cannot be merged unless
# all checks pass.
#
# Flow:
#   feature/* ──PR──> develop   (this workflow must pass)
#   develop   ──PR──> release/* (this workflow must pass)
#   release/* ──PR──> master    (this workflow must pass)
#   master    ──────> auto-tag version (see release-tag.yml)
#
# After merge, the CD pipeline (cd.yml) handles Docker build & deployment.
#
# Branch Protection Rules (configure in GitHub Settings):
#   develop, release/*, master:
#     - Require PR before merging
#     - Require status checks: "Pipeline Status"
#     - Require branches to be up to date
#     - Require signed commits (recommended)
# =============================================================================

name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - "release/**"
      - master
  push:
    branches:
      - develop
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
      - "featur/**"
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===================================================================
  # Step 1: Format check
  # ===================================================================
  format:
    name: Format Check
    uses: ./.github/workflows/format-check.yml
    secrets: inherit

  # ===================================================================
  # Step 2: Security analysis (CodeQL)
  # ===================================================================
  security:
    name: Security Analysis
    needs: [format]
    uses: ./.github/workflows/security-analysis.yml
    secrets: inherit

  # ===================================================================
  # Step 3: Comprehensive tests
  # ===================================================================
  tests:
    name: Comprehensive Tests
    needs: [format]
    uses: ./.github/workflows/comprehensive-tests.yml
    secrets: inherit

  # ===================================================================
  # Step 4: Build validation
  # ===================================================================
  build:
    name: Build Validation
    needs: [security, tests]
    uses: ./.github/workflows/build-validation.yml
    secrets: inherit

  # ===================================================================
  # Final: Pipeline status (used as required check for branch protection)
  # ===================================================================
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [format, security, tests, build]
    if: always()

    steps:
      - name: Check all workflows status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ needs.format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Analysis | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Comprehensive Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Validation | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "**Pipeline FAILED** - merge blocked" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "**Pipeline PASSED** - ready to merge" >> $GITHUB_STEP_SUMMARY

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FORMAT="${{ needs.format.result }}"
          SECURITY="${{ needs.security.result }}"
          TESTS="${{ needs.tests.result }}"
          BUILD="${{ needs.build.result }}"

          if [ "$FORMAT" = "success" ] && [ "$SECURITY" = "success" ] && \
             [ "$TESTS" = "success" ] && [ "$BUILD" = "success" ]; then
            TITLE="CI Pipeline PASSED"
            COLOR=3066993
            STATUS="ready to merge"
          else
            TITLE="CI Pipeline FAILED"
            COLOR=15158332
            STATUS="merge blocked"
          fi

          [ -z "$DISCORD_WEBHOOK" ] && echo "No Discord webhook — ${TITLE}" && exit 0

          PAYLOAD=$(cat <<'INNEREOF'
          {
            "embeds": [{
              "title": "TITLE_PLACEHOLDER",
              "description": "DESC_PLACEHOLDER",
              "url": "URL_PLACEHOLDER",
              "color": COLOR_PLACEHOLDER,
              "footer": { "text": "GitHub Actions — CI Pipeline" }
            }]
          }
          INNEREOF
          )

          PAYLOAD=$(echo "$PAYLOAD" | sed "s|TITLE_PLACEHOLDER|${TITLE}|")
          PAYLOAD=$(echo "$PAYLOAD" | sed "s|COLOR_PLACEHOLDER|${COLOR}|")
          PAYLOAD=$(echo "$PAYLOAD" | sed "s|URL_PLACEHOLDER|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|")
          PAYLOAD=$(echo "$PAYLOAD" | sed "s|DESC_PLACEHOLDER|${{ github.repository }} #${{ github.run_number }} | Branch: ${{ github.ref_name }} | ${STATUS} | Format: ${FORMAT} Security: ${SECURITY} Tests: ${TESTS} Build: ${BUILD}|")
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
