[package]
name = "database"
description = "Database crate for baby sitting service"
authors = ["Level Sony"]
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.5", features = ["postgres", "r2d2"] } # Postgres, connection pool
diesel-async = { version = "0.9.0", features = ["postgres", "deadpool"] }
rocket = { version = "0.5.1", features = ["tls", "secrets"] } # Web framework
dotenvy = "0.15.6"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"


[lib]
name = "database"
path = "src/lib.rs"