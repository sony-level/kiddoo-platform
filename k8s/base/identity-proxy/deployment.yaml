apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-proxy
  labels:
    app: identity-proxy
    app.kubernetes.io/name: identity-proxy
    app.kubernetes.io/part-of: kiddoo-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: identity-proxy
  template:
    metadata:
      labels:
        app: identity-proxy
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: identity-proxy
          image: ghcr.io/sony-level/kiddoo-identity-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kiddoo-config
          env:
            - name: ROCKET_PORT
              value: "8001"
            - name: ROCKET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: rocket-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: database-url
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: oauth-client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: oauth-client-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: jwt-secret
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: keycloak-url
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: keycloak-realm
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: keycloak-client-secret
            - name: OAUTH_STATE
              valueFrom:
                secretKeyRef:
                  name: kiddoo-secrets
                  key: oauth-state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
