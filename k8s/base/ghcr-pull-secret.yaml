# =============================================================================
# ghcr-pull-secret — Secret de pull GHCR genere via External Secrets.
#
# Le PAT GitHub n'est PAS dans Git : il vit dans AWS Secrets Manager sous
# la cle "kiddoo/ghcr-pull" (JSON : {"username": "...", "password": "<PAT>"}).
# L'operateur genere ici un Secret de type kubernetes.io/dockerconfigjson
# que les Deployments referencent via imagePullSecrets.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  labels:
    app.kubernetes.io/part-of: kiddoo-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: kiddoo/ghcr-pull
        property: username
    - secretKey: password
      remoteRef:
        key: kiddoo/ghcr-pull
        property: password
