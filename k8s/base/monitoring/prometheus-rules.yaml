# =============================================================================
# PrometheusRule — Alerting rules based on SLA indicators
#
# SLA targets:
#   - Availability: 99.9% uptime
#   - Latency: p99 < 1s, p50 < 100ms
#   - Error rate: < 1% of requests
#   - Saturation: CPU < 80%, Memory < 85%
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kiddoo-alerts
  labels:
    app.kubernetes.io/part-of: kiddoo-platform
    release: prometheus
spec:
  groups:
    # =========================================================================
    # Availability alerts
    # =========================================================================
    - name: kiddoo.availability
      rules:
        - alert: ServiceDown
          expr: up{job=~"kiddoo.*"} == 0
          for: 1m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Service {{ $labels.service }} is down"
            description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

        - alert: HighErrorRate
          expr: |
            (
              sum(rate(kiddoo_http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(kiddoo_http_requests_total[5m])) by (service)
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "High error rate on {{ $labels.service }}"
            description: "Error rate is {{ $value | humanizePercentage }} (SLA threshold: 1%)"

        - alert: HighErrorRateWarning
          expr: |
            (
              sum(rate(kiddoo_http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(kiddoo_http_requests_total[5m])) by (service)
            ) > 0.005
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Elevated error rate on {{ $labels.service }}"
            description: "Error rate is {{ $value | humanizePercentage }} (warning threshold: 0.5%)"

    # =========================================================================
    # Performance / Latency alerts (SLA)
    # =========================================================================
    - name: kiddoo.performance
      rules:
        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(kiddoo_http_request_duration_seconds_bucket[5m])) by (le, service)
            ) > 1.0
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "p99 latency too high on {{ $labels.service }}"
            description: "p99 latency is {{ $value }}s (SLA threshold: 1s)"

        - alert: HighLatencyP50
          expr: |
            histogram_quantile(0.50,
              sum(rate(kiddoo_http_request_duration_seconds_bucket[5m])) by (le, service)
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "p50 latency elevated on {{ $labels.service }}"
            description: "Median latency is {{ $value }}s (target: < 100ms)"

        - alert: HighConcurrentRequests
          expr: kiddoo_http_requests_in_flight > 100
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "High concurrent requests on kiddoo services"
            description: "{{ $value }} requests in flight"

        - alert: DownstreamServiceSlow
          expr: |
            histogram_quantile(0.99,
              sum(rate(kiddoo_downstream_request_duration_seconds_bucket[5m])) by (le, service, target_service)
            ) > 2.0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Downstream {{ $labels.target_service }} is slow"
            description: "p99 downstream latency is {{ $value }}s from {{ $labels.service }}"

    # =========================================================================
    # Resource saturation alerts
    # =========================================================================
    - name: kiddoo.resources
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace=~"kiddoo-.*"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{resource="cpu", namespace=~"kiddoo-.*"}) by (pod)
            > 0.80
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "High CPU usage on {{ $labels.pod }}"
            description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace=~"kiddoo-.*"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{resource="memory", namespace=~"kiddoo-.*"}) by (pod)
            > 0.85
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "High memory usage on {{ $labels.pod }}"
            description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"

        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"kiddoo-.*"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "{{ $value }} restarts in the last hour"

    # =========================================================================
    # Security alerts
    # =========================================================================
    - name: kiddoo.security
      rules:
        - alert: HighAuthFailureRate
          expr: |
            (
              sum(rate(kiddoo_auth_attempts_total{result="failure"}[5m])) by (service)
              /
              sum(rate(kiddoo_auth_attempts_total[5m])) by (service)
            ) > 0.3
          for: 5m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "High auth failure rate on {{ $labels.service }}"
            description: "{{ $value | humanizePercentage }} of auth attempts are failing (potential brute force)"

        - alert: HighTokenValidationFailures
          expr: |
            sum(rate(kiddoo_auth_token_validations_total{result="failure"}[5m])) by (service) > 10
          for: 5m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "High JWT validation failures on {{ $labels.service }}"
            description: "{{ $value }} failed validations/sec (potential token abuse)"
