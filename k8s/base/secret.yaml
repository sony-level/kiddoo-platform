apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kiddoo-secrets
  labels:
    app.kubernetes.io/part-of: kiddoo-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kiddoo-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: kiddoo/database-url
    - secretKey: oauth-client-id
      remoteRef:
        key: kiddoo/oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: kiddoo/oauth-client-secret
    - secretKey: jwt-secret
      remoteRef:
        key: kiddoo/jwt-secret
