# =============================================================================
# kube-prometheus-stack Helm values
# Deployed via ArgoCD into the 'monitoring' namespace
# =============================================================================

# -- Prometheus
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Scrape all ServiceMonitors across namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # Scrape all PrometheusRules across namespaces
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # Scrape all PodMonitors across namespaces
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
      nginx.ingress.kubernetes.io/auth-realm: "Prometheus - Authentication Required"
    hosts:
      - prometheus.level-sony.cloud
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.level-sony.cloud

# -- Grafana (disabled — hosted externally on separate server)
grafana:
  enabled: false

# -- Alertmanager
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# -- Node exporter (cluster metrics: CPU, RAM, disk, network)
nodeExporter:
  enabled: true

# -- kube-state-metrics (pod status, deployments, etc.)
kubeStateMetrics:
  enabled: true
