# =============================================================================
# kube-prometheus-stack Helm values
# Managed by ArgoCD (k8s/argocd/monitoring.yaml)
# Release name: prometheus | Namespace: monitoring
# =============================================================================

# -- Prometheus
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Scrape all ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    # Scrape all PrometheusRules across all namespaces
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # Scrape all PodMonitors across all namespaces
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - prometheus.level-sony.cloud
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.level-sony.cloud

# -- Grafana (hosted externally — disabled here)
grafana:
  enabled: false

# -- Alertmanager
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# -- Node exporter (cluster metrics: CPU, RAM, disk, network)
nodeExporter:
  enabled: true

# -- kube-state-metrics (pod status, deployments, etc.)
kubeStateMetrics:
  enabled: true
