apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        # Auth par cles IAM statiques (k3s n'est pas EKS -> pas d'IRSA).
        # Les cles sont stockees dans le Secret "awssm-secret" (ns external-secrets).
        secretRef:
          accessKeyIDSecretRef:
            name: awssm-secret
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: awssm-secret
            namespace: external-secrets
            key: secret-access-key