apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kiddoo-secrets
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data:
    - secretKey: database-url
      remoteRef:
        key: kiddoo/test/database-url
    - secretKey: oauth-client-id
      remoteRef:
        key: kiddoo/test/oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: kiddoo/test/oauth-client-secret
    - secretKey: jwt-secret
      remoteRef:
        key: kiddoo/test/jwt-secret
Resources:
  ObservabilityConfiguration:
    Type: AWS::AppRunner::ObservabilityConfiguration
    Properties:
      ObservabilityConfigurationName: MyAppObservabilityConfig
      TraceConfiguration:
        Vendor: AWSXRAY
      Tags:
        - Key: Environment
          Value: Development
        - Key: Application
          Value: MyApp
Metadata:
  AWS::Composer::Groups:
    Group:
      Label: Group
      Members:
        - ObservabilityConfiguration