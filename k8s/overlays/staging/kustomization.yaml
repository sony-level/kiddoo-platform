apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kiddoo-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - path: configmap-patch.yaml
  - path: secret-patch.yaml
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: identity-proxy
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: ghcr.io/sony-level/kiddoo-api-gateway
    newName: ghcr.io/sony-level/kiddoo-api-gateway
    newTag: stable
  - name: ghcr.io/sony-level/kiddoo-identity-proxy
    newName: ghcr.io/sony-level/kiddoo-identity-proxy
    newTag: stable

commonLabels:
  environment: staging
