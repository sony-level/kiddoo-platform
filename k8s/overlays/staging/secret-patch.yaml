apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiddoo-secrets
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data:
    - secretKey: database-url
      remoteRef:
        key: kiddoo/staging/database-url
    - secretKey: oauth-client-id
      remoteRef:
        key: kiddoo/staging/oauth-client-id
    - secretKey: oauth-client-secret
      remoteRef:
        key: kiddoo/staging/oauth-client-secret
    - secretKey: jwt-secret
      remoteRef:
        key: kiddoo/staging/jwt-secret
    - secretKey: rocket-secret-key
      remoteRef:
        key: kiddoo/staging/rocket-secret-key
    - secretKey: keycloak-url
      remoteRef:
        key: kiddoo/staging/keycloak-url
    - secretKey: keycloak-realm
      remoteRef:
        key: kiddoo/staging/keycloak-realm
    - secretKey: keycloak-client-id
      remoteRef:
        key: kiddoo/staging/keycloak-client-id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: kiddoo/staging/keycloak-client-secret
    - secretKey: oauth-state
      remoteRef:
        key: kiddoo/staging/oauth-state
